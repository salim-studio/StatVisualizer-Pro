<script>
let data = [];
let columns = [];

function performKMeansClustering(data, k, maxIterations = 100) {
    // Normalize the data
    const dimensions = data[0].length;
    const min = Array(dimensions).fill(Infinity);
    const max = Array(dimensions).fill(-Infinity);
    
    // Find min and max for each dimension
    data.forEach(point => {
        for(let i = 0; i < dimensions; i++) {
            min[i] = Math.min(min[i], point[i]);
            max[i] = Math.max(max[i], point[i]);
        }
    });
    
    // Normalize data to [0,1] range
    const normalizedData = data.map(point => 
        point.map((val, i) => (val - min[i]) / (max[i] - min[i]))
    );
    
    // Initialize centroids randomly
    let centroids = Array(k).fill().map(() => 
        Array(dimensions).fill().map(() => Math.random())
    );
    
    // Initialize cluster assignments
    let clusters = Array(data.length).fill(0);
    let oldClusters = Array(data.length).fill(-1);
    let iterations = 0;
    
    // Euclidean distance function
    const distance = (a, b) => Math.sqrt(
        a.reduce((sum, val, i) => sum + Math.pow(val - b[i], 2), 0)
    );
    
    // Main k-means loop
    while(!arraysEqual(clusters, oldClusters) && iterations < maxIterations) {
        // Save old clusters
        oldClusters = [...clusters];
        
        // Assign points to nearest centroid
        normalizedData.forEach((point, i) => {
            let minDist = Infinity;
            let minCluster = 0;
            
            centroids.forEach((centroid, j) => {
                const dist = distance(point, centroid);
                if(dist < minDist) {
                    minDist = dist;
                    minCluster = j;
                }
            });
            
            clusters[i] = minCluster;
        });
        
        // Update centroids
        centroids = centroids.map((_, i) => {
            const clusterPoints = normalizedData.filter((_, j) => clusters[j] === i);
            if(clusterPoints.length === 0) {
                // If cluster is empty, reinitialize randomly
                return Array(dimensions).fill().map(() => Math.random());
            }
            // Calculate mean position
            return clusterPoints.reduce((acc, point) => 
                acc.map((val, j) => val + point[j]), 
                Array(dimensions).fill(0)
            ).map(val => val / clusterPoints.length);
        });
        
        iterations++;
    }
    
    return clusters;
}

// Helper function to compare arrays
function arraysEqual(a, b) {
    return JSON.stringify(a) === JSON.stringify(b);
}

function erfinv(x) {
    let w, p;
    const a = 0.147;
    const two_over_pi = 2 / Math.PI;
    const ln2 = Math.log(2);
    
    if (Math.abs(x) > 1) {
        return NaN;
    } else if (x === 1) {
        return Infinity;
    } else if (x === -1) {
        return -Infinity;
    }
    
    if (Math.abs(x) <= 0.7) {
        const xx = x * x;
        p = x * (((4.13330079501428 + xx * (-2.3294325462533)) +
                xx * (1.07602275717623 + xx * (-0.293660666972535))) /
                (((1 + xx * (-0.689944745597729)) +
                xx * (0.451019819875959 + xx * (-0.0895761483076143)))));
        return p;
    }
    
    w = Math.sqrt(-Math.log((1 - Math.abs(x)) / 2));
    
    p = (((((0.135566798655297 + w * (-3.22526046661166)) +
            w * (2.84936670106762 + w * (-1.14605058751345))) +
            w * (0.307622221033423 + w * -0.0651900185650843)) /
            ((((1 + w * (-2.11736840211301)) +
            w * (1.60837851336281 + w * (-0.527905102516275))) +
            w * (0.103484892687284 + w * -0.00610936001971276)))));
    
    return x < 0 ? -p : p;
}

function calculateProbitPlot(data) {
    const sortedData = [...data].sort((a, b) => a - b);
    const n = sortedData.length;
    
    const probs = sortedData.map((_, i) => (i + 0.5) / n);
    
    const probitValues = probs.map(p => {
        return Math.sqrt(2) * erfinv(2 * p - 1);
    });
    
    return {
        x: probitValues,
        y: sortedData
    };
}

function calculateLogitPlot(data) {
    const sortedData = [...data].sort((a, b) => a - b);
    const n = sortedData.length;
    
    const probs = sortedData.map((_, i) => (i + 0.5) / n);
    
    const logits = probs.map(p => {
        const clampedP = Math.max(0.001, Math.min(0.999, p));
        return Math.log(clampedP / (1 - clampedP));
    });
    
    return {
        x: logits,
        y: sortedData
    };
}

function calculateQQPlot(data) {
    const sortedData = [...data].sort((a, b) => a - b);
    const n = sortedData.length;
    
    const theoreticalQuantiles = sortedData.map((_, i) => {
        const p = (i + 0.5) / n;
        return Math.sqrt(2) * erfinv(2 * p - 1);
    });
    
    return {
        x: theoreticalQuantiles,
        y: sortedData
    };
}

function calculatePPPlot(data) {
    const sortedData = [...data].sort((a, b) => a - b);
    const n = sortedData.length;
    
    const empiricalProbs = sortedData.map((_, i) => (i + 1) / n);
    
    const mean = sortedData.reduce((a, b) => a + b, 0) / n;
    const stdDev = Math.sqrt(sortedData.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n);
    
    const theoreticalProbs = sortedData.map(x => {
        const z = (x - mean) / stdDev;
        return 0.5 * (1 + math.erf(z / Math.sqrt(2)));
    });
    
    return {
        x: theoreticalProbs,
        y: empiricalProbs
    };
}

function calculateKDE(data, bandwidth = 'silverman') {
    // Sort data
    const sortedData = [...data].sort((a, b) => a - b);
    
    // Calculate bandwidth using Silverman's rule if not specified
    if (bandwidth === 'silverman') {
        const std = Math.sqrt(sortedData.reduce((acc, val) => acc + Math.pow(val - sortedData.reduce((a, b) => a + b, 0) / sortedData.length, 2), 0) / sortedData.length);
        const iqr = sortedData[Math.floor(sortedData.length * 0.75)] - sortedData[Math.floor(sortedData.length * 0.25)];
        bandwidth = 0.9 * Math.min(std, iqr / 1.34) * Math.pow(sortedData.length, -0.2);
    }
    
    // Generate points for the density curve
    const min = Math.min(...sortedData);
    const max = Math.max(...sortedData);
    const range = max - min;
    const points = 200;
    const step = range / points;
    
    const x = Array.from({length: points + 1}, (_, i) => min + i * step);
    const y = x.map(point => {
        return sortedData.reduce((acc, val) => {
            const u = (point - val) / bandwidth;
            return acc + (1 / (bandwidth * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * u * u);
        }, 0) / sortedData.length;
    });
    
    return {x, y};
}

function calculateARIMA(data, params = {p: 1, d: 1, q: 1}) {
    // Convert data to numeric array
    const values = data.map(Number);
    const n = values.length;

    // Simple differencing for d=1
    const diffValues = [];
    for (let i = 1; i < values.length; i++) {
        diffValues.push(values[i] - values[i-1]);
    }

    // Calculate mean of differenced values
    const mean = diffValues.reduce((a, b) => a + b, 0) / diffValues.length;

    // Simple AR(1) prediction
    const predictions = [values[0]];
    const phi = 0.8; // AR coefficient
    const theta = 0.2; // MA coefficient

    for (let i = 1; i < n; i++) {
        // AR component
        const ar = phi * (values[i-1] - mean);
        // MA component using previous error
        const prevError = values[i-1] - predictions[i-1];
        const ma = theta * prevError;
        // Combine components
        predictions.push(mean + ar + ma);
    }

    // Generate future predictions
    const futurePeriods = Math.floor(n * 0.2); // Predict 20% more periods
    for (let i = 0; i < futurePeriods; i++) {
        const lastValue = predictions[predictions.length - 1];
        const ar = phi * (lastValue - mean);
        predictions.push(mean + ar);
    }

    return {
        original: values,
        predicted: predictions,
        futurePeriods
    };
}

function calculateSARIMA(data, params = {p: 1, d: 1, q: 1, P: 1, D: 1, Q: 1, s: 12}) {
    const values = data.map(Number);
    const n = values.length;

    // Seasonal differencing 
    let seasonalDiff = [];
    for (let i = params.s; i < values.length; i++) {
        seasonalDiff.push(values[i] - values[i - params.s]);
    }

    // Regular differencing on seasonal differences
    let diff = [];
    for (let i = 1; i < seasonalDiff.length; i++) {
        diff.push(seasonalDiff[i] - seasonalDiff[i-1]);
    }

    // Calculate seasonal and non-seasonal components
    const meanDiff = diff.reduce((a, b) => a + b, 0) / diff.length;
    const predictions = [values[0]];
    
    // SARIMA parameters
    const phi = 0.7;    // AR parameter
    const theta = 0.2;  // MA parameter
    const Phi = 0.8;    // Seasonal AR parameter
    const Theta = 0.3;  // Seasonal MA parameter

    // Generate predictions
    for (let i = 1; i < n; i++) {
        // Non-seasonal components
        const ar = phi * (values[i-1] - meanDiff);
        const prevError = values[i-1] - predictions[i-1];
        const ma = theta * prevError;

        // Seasonal components
        const seasonalAR = i >= params.s ? Phi * (values[i-params.s] - meanDiff) : 0;
        const seasonalMA = i >= params.s ? Theta * prevError : 0;

        // Combine components
        predictions.push(meanDiff + ar + ma + seasonalAR + seasonalMA);
    }

    // Generate future predictions
    const futurePeriods = Math.floor(n * 0.2);
    for (let i = 0; i < futurePeriods; i++) {
        const lastValue = predictions[predictions.length - 1];
        const ar = phi * (lastValue - meanDiff);
        const seasonalAR = Phi * (predictions[predictions.length - params.s] - meanDiff);
        predictions.push(meanDiff + ar + seasonalAR);
    }

    return {
        original: values,
        predicted: predictions,
        futurePeriods
    };
}

function calculateCorrelationMatrix(data, variables) {
    const matrix = [];
    const correlations = {};
    
    // Calculate correlations for each pair
    variables.forEach((var1, i) => {
        correlations[var1] = {};
        variables.forEach((var2) => {
            if (!correlations[var1][var2]) {
                const values1 = data.map(d => parseFloat(d[var1])).filter(v => !isNaN(v));
                const values2 = data.map(d => parseFloat(d[var2])).filter(v => !isNaN(v));
                
                // Calculate Pearson correlation
                const mean1 = values1.reduce((a, b) => a + b, 0) / values1.length;
                const mean2 = values2.reduce((a, b) => a + b, 0) / values2.length;
                
                const numerator = values1.reduce((acc, val1, idx) => 
                    acc + (val1 - mean1) * (values2[idx] - mean2), 0);
                    
                const denom1 = Math.sqrt(values1.reduce((acc, val) => 
                    acc + Math.pow(val - mean1, 2), 0));
                const denom2 = Math.sqrt(values2.reduce((acc, val) => 
                    acc + Math.pow(val - mean2, 2), 0));
                
                const corr = numerator / (denom1 * denom2);
                
                correlations[var1][var2] = corr;
                if (var2 !== var1) {
                    if (!correlations[var2]) correlations[var2] = {};
                    correlations[var2][var1] = corr;
                }
            }
        });
    });
    
    return correlations;
}

function handleExcelFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const workbook = XLSX.read(e.target.result, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet);
        
        data = jsonData;
        columns = Object.keys(jsonData[0] || {});
        updateVariableSelectors();
        updatePlotVariables();
    };
    reader.readAsArrayBuffer(file);
}

function updateVariableSelectors() {
    const selectors = ['xVariable', 'yVariable', 'categoryVariable'];
    selectors.forEach(selectorId => {
        const select = document.getElementById(selectorId);
        const currentValue = select.value;
        
        select.innerHTML = '';
        
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.text = `اختر ${selectorId === 'xVariable' ? 'المتغير السيني' : 
                                   selectorId === 'yVariable' ? 'المتغير الصادي' : 
                                   'متغير التصنيف'}`;
        select.appendChild(defaultOption);
        
        columns.forEach(column => {
            const option = document.createElement('option');
            option.value = column;
            option.text = column;
            select.appendChild(option);
        });
        
        if (currentValue && columns.includes(currentValue)) {
            select.value = currentValue;
        }
    });
}

    const chartCategories = [
        { value: 'basic', label: 'الرسوم البيانية الأساسية' },

    const defaultOption = document.createElement('option');

function updatePlotVariables() {
    if (!data.length) return;
    
    const selectedChartType = document.getElementById('secondaryChartType').value;
    if (!selectedChartType) return;

    // Rest of the existing updatePlotVariables function remains the same,
    // just replace all instances of primaryChartType with selectedChartType
    const xVar = document.getElementById('xVariable').value;
    const yVar = document.getElementById('yVariable').value;
    const categoryVar = document.getElementById('categoryVariable').value;

    if (!xVar || !yVar) return;

    const validData = data.filter(d => 
        d[xVar] !== undefined && 
        d[xVar] !== null && 
        d[yVar] !== undefined && 
        d[yVar] !== null
    );

    if (!validData.length) return;

    let traces = [];
    let layout = {
        title: {
            text: 'الرسم البياني التفاعي',
            font: { size: 24, family: 'Arial' }
        },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { 
            family: 'Arial',
            size: 14
        },
        xaxis: { 
            title: {
                text: xVar,
                font: { size: 16 }
            },
            gridcolor: '#eee'
        },
        yaxis: { 
            title: {
                text: yVar,
                font: { size: 16 }
            },
            gridcolor: '#eee'
        },
        showlegend: true,
        direction: 'rtl',
        margin: { t: 80, r: 50, b: 80, l: 80 }
    };

    const clusterControls = document.getElementById('clusterControls');
    clusterControls.style.display = selectedChartType === 'cluster' ? 'block' : 'none';
    
    if (selectedChartType === 'cluster') {
        const k = parseInt(document.getElementById('numClusters').value);
        const xValues = validData.map(d => parseFloat(d[xVar]));
        const yValues = validData.map(d => parseFloat(d[yVar]));
        
        // Prepare data for clustering
        const clusterData = xValues.map((x, i) => [x, yValues[i]]);
        
        // Perform clustering
        const clusters = performKMeansClustering(clusterData, k);
        
        // Create traces for each cluster
        const colors = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', 
                       '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];
                       
        traces = [];
        for(let i = 0; i < k; i++) {
            const clusterPoints = validData.filter((_, index) => clusters[index] === i);
            traces.push({
                x: clusterPoints.map(d => d[xVar]),
                y: clusterPoints.map(d => d[yVar]),
                mode: 'markers',
                type: 'scatter',
                name: `المجموعة ${i + 1}`,
                marker: {
                    size: 10,
                    color: colors[i % colors.length],
                    opacity: 0.7
                }
            });
        }
        
        layout.title.text = `Cluster Analysis (K=${k}) - ${xVar} vs ${yVar}`;
        layout.xaxis.title = xVar;
        layout.yaxis.title = yVar;
    } else if (selectedChartType === 'correlation') {
        // Get numeric columns only
        const numericColumns = columns.filter(col => {
            return data.some(row => !isNaN(parseFloat(row[col])));
        });
        
        const correlations = calculateCorrelationMatrix(data, numericColumns);
        
        // Create correlation heatmap
        const zValues = numericColumns.map(var1 => 
            numericColumns.map(var2 => correlations[var1][var2])
        );
        
        traces = [{
            type: 'heatmap',
            z: zValues,
            x: numericColumns,
            y: numericColumns,
            zmin: -1,
            zmax: 1,
            colorscale: [
                ['0.0', '#0a4c81'],
                ['0.5', '#ffffff'],
                ['1.0', '#c41e3a']
            ],
            showscale: true,
            colorbar: {
                title: 'معامل الارتباط',
                titleside: 'right'
            }
        }];
        
        // Add correlation values as text
        traces.push({
            type: 'heatmap',
            z: zValues,
            x: numericColumns,
            y: numericColumns,
            text: zValues.map(row => 
                row.map(val => val.toFixed(2))
            ),
            texttemplate: '%{text}',
            textfont: {
                color: 'black',
                size: 12
            },
            showscale: false,
            hoverongaps: false
        });

        layout.title.text = 'مصفوفة معاملات الارتباط';
        layout.xaxis = {
            title: '',
            tickangle: 45
        };
        layout.yaxis = {
            title: '',
            autorange: 'reversed'
        };
        layout.width = Math.max(600, numericColumns.length * 80);
        layout.height = Math.max(600, numericColumns.length * 80);
        layout.margin = {
            t: 100,
            b: 100,
            l: 100,
            r: 100
        };
    } else if (selectedChartType === 'arima') {
        const timeValues = validData.map((d, i) => i);
        const yValues = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
        
        const arimaResults = calculateARIMA(yValues);
        
        // Original data trace
        traces = [{
            x: timeValues,
            y: arimaResults.original,
            type: 'scatter',
            mode: 'lines+markers',
            name: 'البيانات الأصلية',
            line: {
                color: '#1f77b4'
            },
            marker: {
                size: 8
            }
        }];
        
        // Predicted values trace
        const allTimePoints = [...timeValues];
        for (let i = timeValues.length; i < arimaResults.predicted.length; i++) {
            allTimePoints.push(i);
        }
        
        traces.push({
            x: allTimePoints,
            y: arimaResults.predicted,
            type: 'scatter',
            mode: 'lines',
            name: 'القيم المتنبأ بها',
            line: {
                color: '#ff7f0e',
                dash: 'dash'
            }
        });

        layout.title.text = `التحليل التنبئي ARIMA - ${yVar}`;
        layout.xaxis.title = 'الزمن';
        layout.yaxis.title = yVar;
        layout.showlegend = true;
    } else if (selectedChartType === 'sarima') {
        const timeValues = validData.map((d, i) => i);
        const yValues = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
        
        const sarimaResults = calculateSARIMA(yValues);
        
        // Original data trace
        traces = [{
            x: timeValues,
            y: sarimaResults.original,
            type: 'scatter',
            mode: 'lines+markers',
            name: 'البيانات الأصلية',
            line: {
                color: '#1f77b4'
            },
            marker: {
                size: 8
            }
        }];
        
        // Predicted values trace
        const allTimePoints = [...timeValues];
        for (let i = timeValues.length; i < sarimaResults.predicted.length; i++) {
            allTimePoints.push(i);
        }
        
        traces.push({
            x: allTimePoints,
            y: sarimaResults.predicted,
            type: 'scatter',
            mode: 'lines',
            name: 'القيم المتنبأ بها',
            line: {
                color: '#ff7f0e',
                dash: 'dash'
            }
        });

        layout.title.text = `التحليل التنبئي الموسمي SARIMA - ${yVar}`;
        layout.xaxis.title = 'الزمن';
        layout.yaxis.title = yVar;
        layout.showlegend = true;
    } else {
        // Other chart types handling...
        if (selectedChartType === 'logit') {
            const numericData = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
            const logitData = calculateLogitPlot(numericData);
            
            traces = [{
                x: logitData.x,
                y: logitData.y,
                mode: 'markers',
                type: 'scatter',
                name: 'Logit Plot',
                marker: {
                    size: 10,
                    opacity: 0.7
                }
            }];

            const xMin = Math.min(...logitData.x);
            const xMax = Math.max(...logitData.x);
            const yMin = Math.min(...logitData.y);
            const yMax = Math.max(...logitData.y);
            
            traces.push({
                x: [xMin, xMax],
                y: [yMin, yMax],
                mode: 'lines',
                type: 'scatter',
                name: 'Reference Line',
                line: {
                    color: 'red',
                    dash: 'dash'
                }
            });

            layout.title.text = `Logit Plot - ${yVar}`;
            layout.xaxis.title = `Logit Values for ${yVar}`;
            layout.yaxis.title = yVar;
        } else if (selectedChartType === 'qq') {
            const numericData = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
            const qqData = calculateQQPlot(numericData);
            
            traces = [{
                x: qqData.x,
                y: qqData.y,
                mode: 'markers',
                type: 'scatter',
                name: 'Q-Q Plot',
                marker: {
                    size: 10,
                    opacity: 0.7
                }
            }];
            
            const min = Math.min(...qqData.x);
            const max = Math.max(...qqData.x);
            traces.push({
                x: [min, max],
                y: [min, max],
                mode: 'lines',
                type: 'scatter',
                name: 'Reference Line',
                line: {
                    color: 'red',
                    dash: 'dash'
                }
            });

            layout.title.text = `Q-Q Plot - ${yVar}`;
            layout.xaxis.title = `النظري Quantiles for ${yVar}`;
            layout.yaxis.title = `العينة Quantiles for ${yVar}`;
        } else if (selectedChartType === 'pp') {
            const numericData = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
            const ppData = calculatePPPlot(numericData);
            
            traces = [{
                x: ppData.x,
                y: ppData.y,
                mode: 'markers',
                type: 'scatter',
                name: 'P-P Plot',
                marker: {
                    size: 10,
                    opacity: 0.7
                }
            }];
            
            traces.push({
                x: [0, 1],
                y: [0, 1],
                mode: 'lines',
                type: 'scatter',
                name: 'Reference Line',
                line: {
                    color: 'red',
                    dash: 'dash'
                }
            });

            layout.title.text = `P-P Plot - ${yVar}`;
            layout.xaxis.title = `النظري Probabilities for ${yVar}`;
            layout.yaxis.title = `التجريبي Probabilities for ${yVar}`;
        } else if (selectedChartType === 'probit') {
            const numericData = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
            const probitData = calculateProbitPlot(numericData);
            
            traces = [{
                x: probitData.x,
                y: probitData.y,
                mode: 'markers',
                type: 'scatter',
                name: 'Probit Plot',
                marker: {
                    size: 10,
                    opacity: 0.7
                }
            }];
            
            const xMin = Math.min(...probitData.x);
            const xMax = Math.max(...probitData.x);
            const yMin = Math.min(...probitData.y);
            const yMax = Math.max(...probitData.y);
            
            traces.push({
                x: [xMin, xMax],
                y: [yMin, yMax],
                mode: 'lines',
                type: 'scatter',
                name: 'Reference Line',
                line: {
                    color: 'red',
                    dash: 'dash'
                }
            });

            layout.title.text = `Probit Plot - ${yVar}`;
            layout.xaxis.title = `Probit Values for ${yVar}`;
            layout.yaxis.title = yVar;
        } else if (selectedChartType === 'pie') {
            let pieData = {};
            validData.forEach(d => {
                const key = d[xVar];
                pieData[key] = (pieData[key] || 0) + Number(d[yVar]);
            });

            traces = [{
                type: 'pie',
                labels: Object.keys(pieData),
                values: Object.values(pieData),
                textinfo: "label+percent",
                insidetextorientation: "radial"
            }];

            layout.title.text = `Pie Chart - ${xVar} vs ${yVar}`;
            layout.xaxis.visible = false;
            layout.yaxis.visible = false;
        } else if (selectedChartType === 'box') {
            layout.title.text = `Box Plot - ${yVar}`;
            layout.yaxis.title = yVar;
            if (categoryVar) {
                layout.xaxis.title = categoryVar;
                traces = [{
                    y: validData.map(d => d[yVar]),
                    type: 'box',
                    name: yVar,
                    boxpoints: 'outliers',
                    jitter: 0.3,
                    pointpos: -1.8
                }];
            } else {
                traces = [{
                    y: validData.map(d => d[yVar]),
                    type: 'box',
                    name: yVar,
                    boxpoints: 'outliers',
                    jitter: 0.3,
                    pointpos: -1.8
                }];
            }
        } else if (categoryVar) {
            const categories = [...new Set(validData.map(d => d[categoryVar]))];
            traces = categories.map(cat => ({
                name: cat,
                x: validData.filter(d => d[categoryVar] === cat).map(d => d[xVar]),
                y: validData.filter(d => d[categoryVar] === cat).map(d => d[yVar]),
                type: selectedChartType,
                mode: selectedChartType === 'scatter' ? 'markers' : undefined,
                marker: { 
                    size: 10,
                    opacity: 0.7
                }
            }));
        } else if (selectedChartType === 'density') {
            const numericData = validData.map(d => parseFloat(d[yVar])).filter(d => !isNaN(d));
            const densityData = calculateKDE(numericData);
            
            traces = [{
                x: densityData.x,
                y: densityData.y,
                type: 'scatter',
                mode: 'lines',
                name: `Density Curve for ${yVar}`,
                line: {
                    color: '#1f77b4',
                    width: 2
                },
                fill: 'tozeroy',
                fillcolor: 'rgba(31, 119, 180, 0.2)'
            }];
            
            // Add histogram as overlay
            traces.push({
                x: numericData,
                type: 'histogram',
                name: 'Histogram',
                opacity: 0.5,
                histnorm: 'probability density',
                nbinsx: 30,
                marker: {
                    color: 'rgba(31, 119, 180, 0.3)'
                }
            });

            layout.title.text = `Density Plot - ${yVar}`;
            layout.xaxis.title = yVar;
            layout.yaxis.title = 'Density';
            layout.bargap = 0.1;
            layout.showlegend = true;
        } else if (selectedChartType === 'grid') {
            // Create grid lines
            const xValues = validData.map(d => parseFloat(d[xVar]));
            const yValues = validData.map(d => parseFloat(d[yVar]));
            
            const xMin = Math.min(...xValues);
            const xMax = Math.max(...xValues);
            const yMin = Math.min(...yValues);
            const yMax = Math.max(...yValues);
            
            // Main scatter plot
            traces = [{
                x: xValues,
                y: yValues,
                type: 'scatter',
                mode: 'markers',
                name: 'البيانات',
                marker: {
                    size: 10,
                    color: '#1f77b4',
                    opacity: 0.7
                }
            }];
            
            // Create vertical grid lines
            const xStep = (xMax - xMin) / 10;
            for (let x = xMin; x <= xMax; x += xStep) {
                traces.push({
                    x: [x, x],
                    y: [yMin, yMax],
                    type: 'scatter',
                    mode: 'lines',
                    line: {
                        color: '#eee',
                        width: 1
                    },
                    showlegend: false,
                    hoverinfo: 'none'
                });
            }
            
            // Create horizontal grid lines
            const yStep = (yMax - yMin) / 10;
            for (let y = yMin; y <= yMax; y += yStep) {
                traces.push({
                    x: [xMin, xMax],
                    y: [y, y],
                    type: 'scatter',
                    mode: 'lines',
                    line: {
                        color: '#eee',
                        width: 1
                    },
                    showlegend: false,
                    hoverinfo: 'none'
                });
            }
            
            layout.title.text = `مخطط شبكي - ${xVar} مقابل ${yVar}`;
            layout.xaxis.title = xVar;
            layout.yaxis.title = yVar;
            layout.xaxis.showgrid = false;
            layout.yaxis.showgrid = false;
            layout.plot_bgcolor = 'white';
        } else {
            traces = [{
                x: validData.map(d => d[xVar]),
                y: validData.map(d => d[yVar]),
                type: selectedChartType,
                mode: selectedChartType === 'scatter' ? 'markers' : undefined,
                marker: { 
                    size: 10,
                    opacity: 0.7
                }
            }];
        }
    }

    Plotly.newPlot('mainPlot', traces, layout, {
        responsive: true,
        displayModeBar: false // Changed from true to false to hide the modebar
    }).catch(err => console.error('Error creating plot:', err));
}

document.getElementById('chartType').addEventListener('change', updatePlotVariables);
document.getElementById('secondaryChartType').addEventListener('change', updatePlotVariables);

document.addEventListener('DOMContentLoaded', () => {
    updateChartTypeSelector();
    updateSecondaryChartTypeSelector();
});
</script>
</body>
</html>
